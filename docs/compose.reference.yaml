# ⛔ A TEMPLATE TO COPY AND ADAPT — never an `include:` and never a file to
# reference from another compose project. The mount list is exactly the part
# that must differ per project, so a shared file would be wrong for everyone.
#
# ⭐ Generated by `consuming/consuming.py` from `consuming.json`, which is this
# component's contract and the only input. Edit the contract, not this file;
# then copy it into your own repository and adapt it there.
#
# ⛔ No Docker socket is mounted here or anywhere else (spec §8.3).

name: "studyforge-editor"

services:
  editor:
    # The image a consumer PINS. It has no registry: build it from this
    # component's checkout and pin the tag the build prints:
    #   python3 docker/editor/build.py --runtimes <the declared set> --print-tag
    # Record the tag that command prints beside the commit this component is
    # pinned at, and set editor.image.env_var to it. Never pin a tag you did not
    # compute and never edit one by hand: a tag is a function of the build's
    # inputs, so a hand-made one names nothing.
    image: "${EDITOR_IMAGE:?build it with docker/editor/build.py and pin the tag it prints}"
    # a container that runs as root writes root-owned files into the mounted
    # sources, and the reader can then never edit their own repository
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # an IDE with a shell comes up when the reader asks for it, not on every
    # boot
    restart: "no"
    # the image must be able to write outside the mounts. The entrypoint's
    # fixuid repairs the passwd record before it seeds anything, so /etc is
    # written at every start; and the warmed practice caches live under /opt,
    # where Gradle and Maven write on every build. A read-only root filesystem,
    # or a mount that makes one of these read-only, breaks the editor at start
    # or breaks every graded run in it
    read_only: false
    environment:
      # explicit rather than derived from $HOME, so the seeded cache and the
      # tool agree
      GRADLE_USER_HOME: "/home/coder/.gradle"
    ports:
      # an unencrypted IDE with a shell AND NO PASSWORD (see
      # command_notes.auth). 0.0.0.0 offers it to every machine that can reach
      # this host; loopback is the WHOLE of this service's access control, so
      # widening this field is not a deployment preference but a decision to put
      # an unauthenticated shell on the network
      - "127.0.0.1:8443:8080"
    # the workspace ROOT is not in the image, so docker would create it root-
    # owned and no build could write .gradle/, .kotlin/ or build/ into it; a
    # named volume there is root-owned for the same reason. A tmpfs is world-
    # writable, holds only those scratch directories, and is discarded with the
    # container. The source binds sit inside it
    tmpfs:
      - /home/coder/repo
    volumes:
      # the corpus's sources, and nothing else: not the repository, not $HOME
      # ⛔ This source must exist on the host BEFORE the container starts, or
      # docker creates it root-owned and nothing in the container can write it.
      - "./sources:/home/coder/repo/sources"
      # code-server's own configuration
      - "editor-config:/home/coder/.config"
      # code-server's user data: the settings the entrypoint seeds once, and the
      # reader's own edits
      - "editor-data:/home/coder/.local"
      # the Gradle user home the entrypoint seeds from the prime when it is
      # empty; omit it when gradle is not declared
      - "gradle-home:/home/coder/.gradle"
      # the Maven local repository the entrypoint seeds from the prime when it
      # is empty; omit it when maven is not declared
      - "maven-repo:/home/coder/.m2"
    # --auth=none is EXPLICIT AND LOAD-BEARING, and the explicitness IS the
    # decision: code-server's default when --auth is absent is password, so an
    # omitted flag is a different setting, not this one. User ruling 2026-09-22,
    # replacing the earlier 'never unauthenticated' ruling. THE BOUNDARY IS THE
    # PORT, NOT THE PASSWORD: ports[0].host_bind is 127.0.0.1, so the only
    # clients that can reach this IDE are processes on this host -- the same
    # trust boundary the study site already publishes on unauthenticated, and
    # any process inside it could read PASSWORD out of the container's own
    # environment anyway. The password stopped no reader it was meant to stop
    # and cost a login form inside every practice iframe. THE CONDITION IS
    # THEREFORE THE BIND: if host_bind is ever widened past loopback, or
    # publish_on_all_interfaces is ever set true, this flag goes back to
    # --auth=password IN THE SAME EDIT. tests/test_consuming.py asserts the two
    # together for exactly that reason.
    # 0.0.0.0 INSIDE the container only, which is the container's own interface;
    # the loopback restriction is the ports entry's host_bind
    # --disable-workspace-trust is LOAD-BEARING and is not a preference: without
    # it the lockdown was once installed and never ran. A corpus's sources
    # arrive as a bind mount, which the workbench has never been told to trust,
    # and a workbench in Restricted Mode disables every extension that does not
    # declare support for one -- silently, with no error and no log line.
    # Measured on code-server 4.137.0: studyforge.practice-focus was installed,
    # listed and never activated, and the Java debug and test extensions were
    # disabled in the same sessions. The image's own CMD carries it too, so a
    # consumer who does not set command: gets it; a consumer who does set
    # command: must keep this argument.
    command:
      - "--auth=none"
      - "--bind-addr=0.0.0.0:8080"
      - "--extensions-dir=/opt/code-server/extensions"
      - "--disable-workspace-trust"
      - "--disable-telemetry"
      - "--disable-update-check"
      - "/home/coder/repo"
    # a consumer whose own service creates one of the bind sources gates this
    # one on it with depends_on: <service>: condition: service_healthy, so the
    # editor starts after the directory exists
    healthcheck:
      test: ["CMD", "/usr/lib/code-server/lib/node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))"]
      start_period: 30s
      start_interval: 1s
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  editor-config:
  editor-data:
  gradle-home:
  maven-repo:
